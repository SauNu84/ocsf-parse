<div class="mapping-tab">
  <div class="editor-toolbar">
    <span class="hint">Edit the mapping JSON. Save runs the linter against the pinned sample.</span>
    <span class="editor-toolbar-spacer"></span>
    <label class="schema-version-picker">
      <span class="schema-version-label">Lint against OCSF</span>
      <select id="schema-version-select">
        {% for v in schema_versions %}
        <option value="{{ '' if v.is_default else v.label }}"{% if v.is_default %} selected{% endif %}>
          {{ v.label }}{% if v.is_default %} (current){% endif %}
        </option>
        {% endfor %}
      </select>
    </label>
    <button id="btn-fix-with-ai"
            class="btn-secondary"
            onclick="ocsfFixWithAI('{{ name }}')"
            disabled
            title="Available after a failed save — asks the configured LLM provider to repair the mapping against the lint errors.">
      ✨ Fix with AI
    </button>
    <button id="btn-regenerate-with-ai"
            class="btn-secondary"
            onclick="ocsfRegenerateWithAI('{{ name }}')"
            title="Discards the current mapping and asks the configured LLM provider to draft a fresh one from the pinned sample.">
      ♻ Regenerate
    </button>
    <button id="btn-suggest-improvements"
            class="btn-secondary"
            onclick="ocsfSuggestImprovements('{{ name }}')"
            title="Coverage-aware: asks the configured LLM provider to add field mappings for OCSF attributes the current mapping isn't yet populating.">
      💡 Suggest
    </button>
    <button class="btn-primary" onclick="ocsfSaveMapping('{{ name }}')">Save</button>
  </div>
  <div id="save-result" class="save-result"></div>
  <div id="ai-result" class="save-result"></div>
  <div id="monaco-host" data-initial="{{ mapping_json|e }}">
    <div class="monaco-loading" aria-live="polite">
      <span class="monaco-loading-spinner" aria-hidden="true"></span>
      <span class="monaco-loading-text">Loading editor… <small>(downloading Monaco JS bundle on first visit)</small></span>
    </div>
  </div>
</div>

<link rel="stylesheet" data-name="vs/editor/editor.main"
      href="https://cdn.jsdelivr.net/npm/monaco-editor@0.46.0/min/vs/editor/editor.main.css">
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.46.0/min/vs/loader.js"></script>
<script>
  // Initialise Monaco for the JSON editor, then expose a save helper that
  // POSTs the current buffer to /sources/<name>/save via fetch (multipart
  // form-data so FastAPI's Form(...) extractor receives it).
  (function() {
    var host = document.getElementById('monaco-host');
    if (!host) return;
    var initial = host.dataset.initial || '{}';

    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.46.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
      window.__ocsfEditor = monaco.editor.create(host, {
        value: initial,
        language: 'json',
        automaticLayout: true,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        fontSize: 12,
      });
    });

    function _setAiButtonEnabled(on) {
      var btn = document.getElementById('btn-fix-with-ai');
      if (btn) btn.disabled = !on;
    }

    // Format "before_score → after_score" delta. Returns "" if either is
    // missing (e.g. mapping doesn't declare any OCSF classes — coverage
    // undefined). Server returns scores in [0, 1]; we render as percent.
    function _coverageDelta(j) {
      if (j == null) return '';
      var b = j.before_score, a = j.after_score;
      if (typeof b !== 'number' || typeof a !== 'number') return '';
      var pct = function(x) { return Math.round(x * 100) + '%'; };
      var arrow = a > b ? '↑' : (a < b ? '↓' : '·');
      var cls = a > b ? 'delta-up' : (a < b ? 'delta-down' : '');
      return ' <span class="coverage-delta ' + cls + '">coverage ' +
             pct(b) + ' ' + arrow + ' ' + pct(a) + '</span>';
    }

    window.ocsfSaveMapping = function(name) {
      if (!window.__ocsfEditor) return;
      var content = window.__ocsfEditor.getValue();
      var fd = new FormData();
      fd.append('content', content);
      var pick = document.getElementById('schema-version-select');
      if (pick) fd.append('schema_version', pick.value || '');
      // Clear any prior AI notice when the user re-saves.
      document.getElementById('ai-result').innerHTML = '';
      fetch('/sources/' + encodeURIComponent(name) + '/save', { method: 'POST', body: fd })
        .then(function(r) { return r.text().then(function(t) { return { html: t, ok: r.ok }; }); })
        .then(function(res) {
          document.getElementById('save-result').innerHTML = res.html;
          // Save failed → enable Fix-with-AI. Save succeeded → disable it.
          _setAiButtonEnabled(!res.ok);
        })
        .catch(function(err) {
          document.getElementById('save-result').innerHTML =
            '<div class="save-error">network error: ' + err + '</div>';
          _setAiButtonEnabled(true);  // still let the user try AI fix
        });
    };

    window.ocsfRegenerateWithAI = function(name) {
      if (!window.__ocsfEditor) return;
      if (!window.confirm(
        "Discard the current mapping and re-draft it from the pinned sample?\n\n" +
        "Your unsaved edits will be lost. The new draft replaces the editor buffer; " +
        "you'll need to click Save before it lands on disk."
      )) return;
      var btn = document.getElementById('btn-regenerate-with-ai');
      var aiBox = document.getElementById('ai-result');
      var fd = new FormData();
      var pick = document.getElementById('schema-version-select');
      if (pick) fd.append('schema_version', pick.value || '');
      if (btn) { btn.disabled = true; btn.textContent = '♻ Drafting…'; }
      aiBox.innerHTML = '';
      fetch('/sources/' + encodeURIComponent(name) + '/regenerate-with-ai',
            { method: 'POST', body: fd })
        .then(function(r) { return r.json().then(function(j) { return { json: j, ok: r.ok }; }); })
        .then(function(res) {
          var j = res.json;
          if (res.ok && j.ok && j.mapping) {
            window.__ocsfEditor.setValue(j.mapping);
            var cacheTag = j.cached
              ? ' <em>(cached — no API call)</em>'
              : '';
            aiBox.innerHTML =
              '<div class="ai-ok">' +
              '♻ Fresh draft generated from the pinned sample via <code>' +
              (j.provider || 'provider') + '</code>' +
              (j.schema_version ? ' (OCSF ' + j.schema_version + ')' : '') +
              cacheTag + _coverageDelta(j) +
              '. Review the editor and click <strong>Save</strong> when ready.' +
              '</div>';
            // Clear any stale save_result from before the regen.
            document.getElementById('save-result').innerHTML = '';
            _setAiButtonEnabled(false);
          } else {
            var msg = (j && j.error) || ('HTTP ' + (res.ok ? '200' : 'error'));
            aiBox.innerHTML = '<div class="ai-error">♻ ' + msg + '</div>';
          }
        })
        .catch(function(err) {
          aiBox.innerHTML = '<div class="ai-error">network error: ' + err + '</div>';
        })
        .finally(function() {
          if (btn) { btn.textContent = '♻ Regenerate'; btn.disabled = false; }
        });
    };

    window.ocsfSuggestImprovements = function(name) {
      if (!window.__ocsfEditor) return;
      if (!window.confirm(
        "Ask AI to add OCSF field mappings the current mapping is missing?\n\n" +
        "Your existing field mappings are preserved; new ones are added for " +
        "the uncovered required + recommended attributes. The new mapping " +
        "replaces the editor buffer; you'll need to click Save before it " +
        "lands on disk."
      )) return;
      var btn = document.getElementById('btn-suggest-improvements');
      var aiBox = document.getElementById('ai-result');
      var content = window.__ocsfEditor.getValue();
      var fd = new FormData();
      fd.append('content', content);
      var pick = document.getElementById('schema-version-select');
      if (pick) fd.append('schema_version', pick.value || '');
      if (btn) { btn.disabled = true; btn.textContent = '💡 Thinking…'; }
      aiBox.innerHTML = '';
      fetch('/sources/' + encodeURIComponent(name) + '/suggest-improvements',
            { method: 'POST', body: fd })
        .then(function(r) { return r.json().then(function(j) { return { json: j, ok: r.ok }; }); })
        .then(function(res) {
          var j = res.json;
          if (res.ok && j.ok && j.mapping) {
            window.__ocsfEditor.setValue(j.mapping);
            var cacheTag = j.cached ? ' <em>(cached — no API call)</em>' : '';
            aiBox.innerHTML =
              '<div class="ai-ok">' +
              '💡 Added field mappings for ' + (j.missing_attrs || 0) +
              ' uncovered attribute(s) via <code>' +
              (j.provider || 'provider') + '</code>' +
              (j.schema_version ? ' (OCSF ' + j.schema_version + ')' : '') +
              cacheTag + _coverageDelta(j) +
              '. Review the editor and click <strong>Save</strong> when ready.' +
              '</div>';
            document.getElementById('save-result').innerHTML = '';
            _setAiButtonEnabled(false);
          } else {
            var msg = (j && j.error) || ('HTTP ' + (res.ok ? '200' : 'error'));
            aiBox.innerHTML = '<div class="ai-error">💡 ' + msg + '</div>';
          }
        })
        .catch(function(err) {
          aiBox.innerHTML = '<div class="ai-error">network error: ' + err + '</div>';
        })
        .finally(function() {
          if (btn) { btn.textContent = '💡 Suggest'; btn.disabled = false; }
        });
    };

    window.ocsfFixWithAI = function(name) {
      if (!window.__ocsfEditor) return;
      var btn = document.getElementById('btn-fix-with-ai');
      var aiBox = document.getElementById('ai-result');
      var content = window.__ocsfEditor.getValue();
      var fd = new FormData();
      fd.append('content', content);
      var pick = document.getElementById('schema-version-select');
      if (pick) fd.append('schema_version', pick.value || '');
      if (btn) { btn.disabled = true; btn.textContent = '✨ Thinking…'; }
      aiBox.innerHTML = '';
      fetch('/sources/' + encodeURIComponent(name) + '/fix-with-ai',
            { method: 'POST', body: fd })
        .then(function(r) { return r.json().then(function(j) { return { json: j, ok: r.ok }; }); })
        .then(function(res) {
          var j = res.json;
          if (res.ok && j.ok && j.mapping) {
            // Stuff the suggestion into Monaco. User still has to Save —
            // that's the linter gate. AI is just a typing accelerator.
            window.__ocsfEditor.setValue(j.mapping);
            var cacheTag = j.cached
              ? ' <em>(cached — no API call)</em>'
              : '';
            aiBox.innerHTML =
              '<div class="ai-ok">' +
              '✨ AI suggested a fix for ' + (j.n_errors_fixed || 0) +
              ' error(s) via <code>' + (j.provider || 'provider') + '</code>' +
              (j.schema_version ? ' (OCSF ' + j.schema_version + ')' : '') +
              cacheTag + _coverageDelta(j) +
              '. Review the editor and click <strong>Save</strong> when ready.' +
              '</div>';
          } else {
            var msg = (j && j.error) || ('HTTP ' + (res.ok ? '200' : 'error'));
            aiBox.innerHTML = '<div class="ai-error">✨ ' + msg + '</div>';
          }
        })
        .catch(function(err) {
          aiBox.innerHTML = '<div class="ai-error">network error: ' + err + '</div>';
        })
        .finally(function() {
          if (btn) { btn.textContent = '✨ Fix with AI'; btn.disabled = false; }
        });
    };
  })();
</script>
