<div class="snippets-tab">
  <p class="hint">
    Copy-paste-ready code for <code>{{ name }}</code>. Each block uses the
    mapping path and pinned sample wired into your local repo layout.
  </p>
  {% for s in snippets %}
  <div class="snippet">
    <div class="snippet-head">
      <span class="snippet-title">{{ s.title }}</span>
      <button type="button" class="snippet-copy" data-copy-target="snippet-code-{{ loop.index }}">
        Copy
      </button>
    </div>
    <pre id="snippet-code-{{ loop.index }}" class="snippet-code lang-{{ s.lang }}"><code>{{ s.code }}</code></pre>
  </div>
  {% endfor %}
</div>

<script>
(function () {
  document.querySelectorAll('.snippets-tab .snippet-copy').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = document.getElementById(btn.dataset.copyTarget);
      if (!target) return;
      var text = target.textContent;
      var done = function () {
        var orig = btn.textContent;
        btn.textContent = '✓ Copied';
        btn.disabled = true;
        setTimeout(function () { btn.textContent = orig; btn.disabled = false; }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {
          // Fall through to legacy path on permission denial.
          _legacyCopy(text); done();
        });
      } else {
        _legacyCopy(text); done();
      }
    });
  });

  function _legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'absolute'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }
}());
</script>
