[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocsf-mapper"
version = "0.4.2"
description = "Map arbitrary log sources to OCSF events via a declarative JSON DSL."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ocsf-parse contributors" }]
keywords = ["ocsf", "security", "logs", "parser", "siem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai    = ["openai>=1.40"]
parquet   = ["pyarrow>=14"]
fast      = ["orjson>=3.10"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
ocsf-mapper = "ocsf_mapper.cli:main"

[project.urls]
Homepage = "https://github.com/ocsf/ocsf-parse"
Issues   = "https://github.com/ocsf/ocsf-parse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocsf_mapper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ocsf_mapper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
