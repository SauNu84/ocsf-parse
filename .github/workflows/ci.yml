name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout (with ocsf-schema submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,parquet]

      - name: Run pytest (with coverage)
        run: |
          python -m pytest --cov=ocsf_mapper --cov-report=term --cov-fail-under=90

      - name: Lint all mappings against their pinned samples
        run: |
          python -m ocsf_mapper.lint mappings/
