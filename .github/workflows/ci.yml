name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout (with ocsf-schema submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Materialise pinned OCSF schema versions
        # Tests for the schema-version selector (added in v0.4.0) expect
        # ocsf-schema-1.8.0/ + ocsf-schema-1.7.0/ as sibling worktrees of
        # the submodule. The script is idempotent.
        run: bash scripts/setup_schema_versions.sh

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + every optional extra
        # Match what `publish.yml` installs (dev,web,parquet,fast) so
        # the regular CI catches bugs that only surface when extras are
        # present — e.g. the _fastjson stdlib-fallback test only fails
        # when orjson is actually installed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,web,parquet,fast]'

      - name: Run pytest (with coverage)
        run: |
          python -m pytest --cov=ocsf_mapper --cov-report=term --cov-fail-under=90

      - name: Lint all mappings against their pinned samples
        run: |
          python -m ocsf_mapper.lint mappings/
